name: rentflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow -d rentflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - rentflow-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3001"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: development
      PORT: "3000"
      # Gateway mode: the API also reverse-proxies page requests to the web service.
      WEB_ORIGIN: http://web:3001
      DATABASE_URL: postgres://rentflow:rentflow@postgres:5432/rentflow?sslmode=disable
      COOKIE_SECURE: "false"
      SMS_PROVIDER: mock
      # Local placeholder only; override in the ignored backend/.env.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-chars}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  rentflow-postgres:
